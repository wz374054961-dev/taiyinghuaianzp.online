<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>培训批次在编看板</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  :root{
    --bg:#F5F5F7;
    --surface:#FFFFFF;
    --surface-alt:#F5F5F7;
    --border:#D2D2D7;
    --border-strong:#C7C7CC;
    --ink:#1D1D1F;
    --ink-soft:#6E6E73;
    --ink-faint:#86868B;
    --brand:#0071E3;
    --brand-strong:#005BB5;
    --brand-soft:#EAF4FF;
    --good:#00865A;
    --good-bg:#E7F7EF;
    --good-border:#BDE8D3;
    --warn:#B86E00;
    --warn-bg:#FFF4DD;
    --warn-border:#F1D9A5;
    --bad:#D64545;
    --bad-bg:#FFF0F0;
    --bad-border:#F0C4C4;
    --radius:18px;
    --shadow:0 1px 2px rgba(0,0,0,.03), 0 10px 24px -18px rgba(0,0,0,.24);
    --shadow-raised:0 2px 5px rgba(0,0,0,.04), 0 16px 30px -20px rgba(0,0,0,.28);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei","微软雅黑",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono,.disp{ font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei","微软雅黑",sans-serif; }

  .wrap{ max-width:1800px; margin:0 auto; padding:34px 32px 72px; }

  /* ---- Top header ---- */
  header.page{
    display:flex; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; gap:16px;
    margin-bottom:20px;
  }
  header.page h1{
    font-size:27px; font-weight:700; letter-spacing:-.5px; margin:0 0 5px;
    color:var(--ink);
  }
  header.page .sub{ color:var(--ink-soft); font-size:12px; }
  .date-field{ display:flex; align-items:center; gap:8px; color:var(--ink-soft); font-size:12px; }
  .date-field input{
    border:1px solid var(--border); border-radius:10px; height:32px; padding:0 10px; line-height:30px;
    font-size:12px; font-family:inherit; color:var(--ink); background:var(--surface);
  }

  /* ---- Toolbar ---- */
  .toolbar{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    margin-bottom:20px;
  }
  .btn{
    appearance:none; border:1px solid var(--border); background:var(--surface);
    color:var(--ink); padding:8px 13px; border-radius:999px; font-size:12px; font-weight:600;
    cursor:pointer; display:inline-flex; align-items:center; gap:6px; transition:transform .15s, border-color .15s, box-shadow .15s, color .15s;
    font-family:inherit;
  }
  .btn:hover{ border-color:var(--brand); color:var(--brand-strong); box-shadow:var(--shadow-raised); transform:translateY(-1px); }
  .btn.primary{ background:var(--brand); border-color:var(--brand); color:#fff; }
  .btn.primary:hover{ background:var(--brand-strong); color:#fff; }
  .btn.ghost{ border-color:transparent; background:transparent; color:var(--ink-soft); }
  .btn.ghost:hover{ background:var(--surface-alt); color:var(--ink); }
  .btn.small{ padding:5px 10px; font-size:12px; border-radius:999px; }
  .save-indicator{ font-size:12.5px; color:var(--ink-faint); margin-left:4px; }
  .save-indicator.flash{ color:var(--good); font-weight:600; }
  .image-copy-indicator{ font-size:12.5px; color:var(--ink-faint); }
  .image-copy-indicator.success{ color:var(--good); font-weight:600; }
  .image-copy-indicator.error{ color:var(--bad); }
  #importFile{ display:none; }

  /* ---- Summary strip ---- */
  .summary-strip{
    display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:20px;
  }
  .stat-card{
    position:relative; overflow:hidden; background:var(--surface); border:1px solid var(--border); border-radius:18px;
    padding:16px 18px; box-shadow:var(--shadow);
  }
  .stat-card::before{ display:none; }
  .stat-card .label{ font-size:11px; color:var(--ink-soft); margin-bottom:7px; letter-spacing:.1px; }
  .stat-card .value{ font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei","微软雅黑",sans-serif; font-size:26px; font-weight:700; letter-spacing:-.4px; color:var(--ink); }
  .stat-card .value small{ font-size:12px; font-weight:600; color:var(--ink-faint); margin-left:2px; }
  .stat-card .value.good{ color:var(--good); }
  .stat-card .value.warn{ color:var(--warn); }
  .stat-card .value.bad{ color:var(--bad); }

  /* ---- Batch grid ---- */
  .batch-grid{
    display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:12px; align-items:start;
  }
  @media (max-width:1180px){ .batch-grid{ grid-template-columns:repeat(3,minmax(0,1fr)); } .summary-strip{ grid-template-columns:repeat(2,1fr); } }
  @media (max-width:840px){ .batch-grid{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
  @media (max-width:560px){ .batch-grid{ grid-template-columns:1fr; } .summary-strip{ grid-template-columns:1fr; } }

  .batch-card{
    position:relative; background:var(--surface); border:1px solid var(--border); border-radius:18px;
    box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column;
  }
  .batch-card::before{ display:none; }
  .batch-head{
    padding:16px 16px 14px; border-bottom:1px solid var(--border); background:var(--surface);
  }
  .batch-head .title-row{ display:flex; align-items:flex-start; justify-content:space-between; gap:6px; }
  .batch-head h2{ min-width:0; font-size:16px; font-weight:700; line-height:1.28; letter-spacing:-.15px; margin:0; color:var(--ink); }
  .batch-actions{ display:flex; align-items:center; gap:4px; flex-shrink:0; }
  .batch-head .stage{ font-family:inherit; font-size:10px; color:var(--ink-soft); background:var(--surface-alt); border:1px solid var(--border); height:24px; padding:0 8px; line-height:22px; border-radius:999px; white-space:nowrap; cursor:pointer; }
  .schedule-toggle{ display:inline-flex; align-items:center; justify-content:center; border:1px solid var(--good-border); background:var(--good-bg); color:var(--good); height:24px; padding:0 7px; line-height:1; border-radius:999px; font:600 10px inherit; cursor:pointer; }
  .schedule-toggle.rest{ border-color:var(--warn-border); background:var(--warn-bg); color:var(--warn); }
  .batch-head .open-info{ font-size:10.5px; color:var(--ink-faint); margin-top:4px; }

  .batch-nums{ display:flex; gap:6px; margin-top:12px; }
  .batch-nums .num{ flex:1; }
  .batch-nums .num .n{ font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei","微软雅黑",sans-serif; font-size:18px; font-weight:700; letter-spacing:-.2px; color:var(--ink); }
  .batch-nums .num .l{ font-size:9.5px; line-height:1.3; color:var(--ink-soft); margin-top:2px; }
  .batch-nums .num.bad .n{ color:var(--bad); }
  .batch-nums .num.good .n{ color:var(--good); }
  .batch-nums .num.warn .n{ color:var(--warn); }

  .seg-bar{ height:6px; border-radius:4px; overflow:hidden; display:flex; margin-top:10px; background:var(--surface-alt); border:1px solid var(--border); }
  .seg-bar div{ height:100%; }
  .seg-legend{ display:flex; gap:9px; margin-top:7px; flex-wrap:wrap; }
  .seg-legend span{ font-size:10px; color:var(--ink-soft); display:flex; align-items:center; gap:4px; }
  .seg-legend i{ width:6px; height:6px; border-radius:2px; display:inline-block; }

  .batch-note{ margin-top:10px; font-size:10px; color:var(--warn); background:var(--warn-bg); border:1px solid var(--warn-border); padding:7px 8px; border-radius:12px; line-height:1.45; }

  /* ---- Roster table ---- */
  .roster{ padding:5px 8px 12px; flex:1; }
  .roster-header-row{
    display:grid; grid-template-columns:20px 1fr 68px 54px 18px; gap:4px;
    font-size:9.5px; color:var(--ink-faint); padding:7px 4px 4px; letter-spacing:.2px;
  }
  .roster-header-row span:nth-child(3),.roster-header-row span:nth-child(4){ text-align:center; }
  .person-row{
    display:grid; grid-template-columns:20px 1fr 68px 54px 18px; gap:4px; align-items:center;
    padding:5px 4px; border-radius:10px; transition:.15s;
  }
  .person-row:hover{ background:var(--surface-alt); }
  .person-row.left{ opacity:.6; }
  .idx{ font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei","微软雅黑",sans-serif; font-size:9.5px; color:var(--ink-faint); text-align:center; }
  .name-cell{ display:flex; align-items:center; gap:4px; min-width:0; }
  .name-cell input.name-input{
    border:none; background:transparent; font-size:12px; color:var(--ink); width:100%;
    height:22px; padding:0 2px; line-height:20px; border-radius:5px; font-family:inherit; font-weight:500;
  }
  .name-cell input.name-input:focus{ background:var(--surface); outline:1px solid var(--brand); }
  .name-cell input.name-input.placeholder-name{ color:var(--ink-faint); font-style:italic; font-weight:400; }
  .tag-badge{
    display:inline-flex; align-items:center; justify-content:center; min-height:18px; font-size:9px; line-height:1; background:var(--brand); color:#fff; padding:0 5px; border-radius:4px;
    flex-shrink:0; font-weight:600; border-radius:999px;
  }
  .chip-toggle{ display:flex; gap:3px; justify-content:center; }
  .chip{
    appearance:none; display:inline-flex; align-items:center; justify-content:center; min-height:22px; vertical-align:middle;
    border:1px solid var(--border-strong); background:var(--surface); color:var(--ink-faint);
    font-size:9.5px; padding:3px 5px; border-radius:999px; cursor:pointer; font-weight:600;
    font-family:inherit; line-height:1; transition:.12s;
  }
  .chip.att-present.active{ background:var(--good-bg); border-color:var(--good-border); color:var(--good); }
  .chip.att-absent.active{ background:var(--warn-bg); border-color:var(--warn-border); color:var(--warn); }
  .rest-tag{ font-size:9.5px; color:var(--ink-faint); text-align:center; }
  .status-chip{
    appearance:none; display:inline-flex; align-items:center; justify-content:center; min-height:22px; line-height:1; vertical-align:middle;
    border:1px solid var(--border-strong); background:var(--surface); font-size:10px;
    padding:3px 5px; border-radius:999px; cursor:pointer; font-weight:600; font-family:inherit;
    width:100%; text-align:center; transition:.12s;
  }
  .status-chip.on{ color:var(--good); }
  .status-chip.off{ background:var(--bad-bg); border-color:var(--bad-border); color:var(--bad); }
  .del-btn{
    border:none; background:transparent; color:var(--ink-faint); cursor:pointer; font-size:13px;
    width:18px; height:22px; border-radius:5px; display:flex; align-items:center; justify-content:center;
  }
  .del-btn:hover{ background:var(--bad-bg); color:var(--bad); }

  .note-row{ grid-column:1 / -1; margin:2px 4px 6px 24px; }
  .note-row textarea{
    width:100%; height:24px; min-height:24px; resize:none; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; border:1px solid var(--bad-border); background:var(--bad-bg);
    color:var(--ink); font-size:8.5px; line-height:22px; border-radius:10px; padding:0 7px; font-family:inherit;
  }
  .today-note-row{ grid-column:1 / -1; margin:0 4px 6px 24px; font-size:10px; color:var(--warn); }

  .add-person{
    margin:8px 8px 4px; width:calc(100% - 16px); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; min-height:30px; background:var(--surface-alt); color:var(--ink-soft); padding:0 7px; line-height:1; border-radius:12px; cursor:pointer;
    font-size:11px; font-family:inherit;
  }
  .add-person:hover{ border-color:var(--brand); color:var(--brand-strong); background:var(--brand-soft); }

  footer.hint{ margin-top:22px; font-size:11px; color:var(--ink-faint); text-align:center; }
</style>
</head>
<body>
<div class="wrap">

  <header class="page">
    <div>
      <h1>培训批次在编看板</h1>
      <div class="sub">0810 · 0812 · 诗惠如组 · 0907 · 0922诗佑琪组 — 出勤打标 / 流失剔除 / 原因备注</div>
    </div>
    <div class="date-field">
      统计日期
      <input type="date" id="reportDate">
    </div>
  </header>

  <div class="toolbar">
    <button class="btn primary" id="saveBtn">💾 保存</button>
    <button class="btn" id="exportJsonBtn">导出备份 (JSON)</button>
    <button class="btn" id="importJsonBtn">导入备份</button>
    <input type="file" id="importFile" accept="application/json">
    <button class="btn" id="exportCsvBtn">导出花名册 (CSV)</button>
    <button class="btn" id="copyImageBtn">🖼️ 复制看板图片</button>
    <button class="btn ghost" id="resetBtn">恢复初始数据</button>
    <span class="save-indicator" id="saveIndicator">尚未保存</span>
    <span class="image-copy-indicator" id="imageCopyStatus" role="status" aria-live="polite"></span>
  </div>

  <div class="summary-strip" id="summaryStrip"></div>

  <div class="batch-grid" id="batchGrid"></div>

  <footer class="hint">数据自动保存在本浏览器（localStorage）。如需在不同电脑间同步，请使用「导出备份」并在另一台设备上「导入备份」。</footer>
</div>

<script>
/* =========================================================

========================================================= */
function makePerson(name, opts){
  opts = opts || {};
  return {
    id: 'p_' + Math.random().toString(36).slice(2,10),
    name: name,
    tag: opts.tag || '',
    placeholder: !!opts.placeholder,
    active: opts.active !== undefined ? opts.active : true,   // true=在岗, false=已流失
    leaveReason: opts.leaveReason || '',
    todayAttend: opts.todayAttend === undefined ? null : opts.todayAttend, // true=出勤 false=未出勤 null=未设置
    todayNote: opts.todayNote || ''
  };
}

function create0907Batch(){
  return {
    id:'b0907', name:'0907批次', openDate:'2026-09-07', stage:'业训',
    trackAttendance:true, restToday:false,

function getRosterAlias(batchId, name){
  return (ROSTER_ALIASES[batchId] || {})[name] || name;
}
let state = loadState();

function normalizeStage(stage){
  return STAGE_OPTIONS.find(option => String(stage || '').includes(option)) || STAGE_OPTIONS[0];
}

function getTodayISO(){
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, '0');
  const day = String(now.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function create0819Groups(){
  return [
    {
      id:'b0819_shimei', name:'0819诗美伊组', openDate:'2026-08-19', stage:'业训',
      trackAttendance:true, restToday:false, batchNote:'',
      people:['诗鸣琅','诗苇洲','诗逍歌','诗鸣宇','诗青樱','诗芊雯','诗芷瞳','诗安宇','诗砚星','诗意妍','诗沐寒','诗嘉许','诗安沁']
        .map(name=>makePerson(name,{todayAttend:true}))
    },
    {
      id:'b0819_shihui', name:'0819诗惠如组', openDate:'2026-08-19', stage:'业训',
      trackAttendance:true, restToday:false, batchNote:'',
      people:['诗阮琴','诗简清','诗艺珊','诗初筝','诗孟芸','诗晏书','诗芷音','诗清洛','诗君安','诗奇煜','诗琼英','诗晏修','诗清越','诗东篱']
        .map(name=>makePerson(name,{todayAttend:true}))
    }
  ];
}

function migrate0819Groups(data){
  const ids = new Set(['b0819', 'b0819_shimei', 'b0819_shihui']);
  const names = new Set(['0819诗美伊组', '0819美伊组', '0819诗惠如组', '诗惠如组']);
  const is0819 = batch=>ids.has(batch.id) || names.has(batch.name);
  const groups = data.batches.filter(is0819);
  if(!groups.length) return;
  const firstIndex = data.batches.findIndex(is0819);
  const primary = groups.find(batch=>batch.id==='b0819_shihui') ||
    groups.find(batch=>batch.name==='0819诗惠如组' || batch.name==='诗惠如组') || groups[0];
  const merged = {...primary, id:'b0819_shihui', name:'诗惠如组', people:[]};
  const personIds = new Set();
  [primary, ...groups.filter(batch=>batch!==primary)].forEach(batch=>{
    (Array.isArray(batch.people) ? batch.people : []).forEach((person,index)=>{
      let record = person;
      if(!person.id || personIds.has(person.id)){
        let suffix = index;
        let id;
        do { id = batch.id+'_'+(person.id || 'person')+'_'+suffix++; }
        while(personIds.has(id));
        record = {...person, id};
      }
      personIds.add(record.id);
      merged.people.push(record);
    });
  });
  data.batches = data.batches.filter(batch=>!is0819(batch));
  data.batches.splice(firstIndex, 0, merged);
}

function migrate0907Batch(data){
  if(!data.batches.some(batch=>batch.id==='b0907')) data.batches.push(create0907Batch());
}

function migrate0922Batch(data){
  if(!data.batches.some(batch=>batch.id==='b0922')) data.batches.push(create0922Batch());
}

function migrateShiXingQiTransfer(data){
  const source = data.batches.find(batch=>batch.id==='b0812');
  const target = data.batches.find(batch=>batch.id==='b0907');
  if(!target) return;
  const isShiXingQi = person=>person.name==='诗星祺' || person.name==='宋洁';
  const sourceIndex = source ? source.people.findIndex(isShiXingQi) : -1;
  const person = sourceIndex>=0 ? source.people.splice(sourceIndex, 1)[0] : target.people.find(isShiXingQi);
  if(!person) return;
  person.name = '诗星祺';
  person.active = true;
  const targetIndex = target.people.findIndex(record=>record.id===person.id);
  if(targetIndex>=0) target.people[targetIndex] = person;
  else target.people.push(person);
}

function normalizeState(data){
  if(!data || !Array.isArray(data.batches)) return defaultData();
  migrate0819Groups(data);
  migrate0907Batch(data);
  migrate0922Batch(data);
  data.batches.forEach(batch=>{
    if(BATCH_DISPLAY_NAMES[batch.id]) batch.name = BATCH_DISPLAY_NAMES[batch.id];
    batch.stage = normalizeStage(batch.stage);
    batch.people = Array.isArray(batch.people) ? batch.people : [];
    batch.people.forEach(person=>{
      person.name = getRosterAlias(batch.id, person.name);
      person.active = person.active !== false;
      person.leaveReason = person.leaveReason || '';
      person.todayNote = person.todayNote || '';
    });
  });
  // 仅迁移旧数据一次；之后手动修改的在岗状态和班组不再被重置。
  if((Number(data.schemaVersion) || 0)<4) migrateShiXingQiTransfer(data);
  data.schemaVersion = DATA_SCHEMA_VERSION;
  data.reportDate = getTodayISO();
  return data;
}

function batchStats(b){
  const total = b.people.length;
  const active = b.people.filter(p=>p.active).length;
  const left = total - active;
  const attritionRate = total ? (left/total*100) : 0;
  let attendRate = null, present=0, absent=0;
  if(b.trackAttendance){
    const activePeople = b.people.filter(p=>p.active);
    present = activePeople.filter(p=>p.todayAttend===true).length;
    absent = activePeople.filter(p=>p.todayAttend===false).length;
    const tracked = present+absent;
    attendRate = tracked ? (present/activePeople.length*100) : null;
  }
  return {total, active, left, attritionRate, present, absent, attendRate};
}

function formatReportDate(date){
  const [, month, day] = String(date || '').split('-');
  return month && day ? `${Number(month)}月${Number(day)}日` : '最新';
}

function getBatchNote(b, s){
  if(b.restToday) return `开培共 ${s.total} 人，已流失 ${s.left} 人，当前在册 ${s.active} 人。今天（${formatReportDate(state.reportDate)}），排休。`;
  return `开培共 ${s.total} 人，已流失 ${s.left} 人，当前在册 ${s.active} 人。今天（${formatReportDate(state.reportDate)}），应出勤 ${s.active} 人，实出勤 ${s.present} 人。`;
}

function autoResizeTextarea(textarea){
  textarea.style.height = '24px';
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const normalized = normalizeState(JSON.parse(raw));
      localStorage.setItem(STORAGE_KEY, JSON.stringify(normalized));
      return normalized;
    }
  }catch(e){ console.warn('读取本地存储失败', e); }
  return normalizeState(defaultData());
}

function persist(flash){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  const ind = document.getElementById('saveIndicator');
  const now = new Date();
  const t = now.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  ind.textContent = '已保存 · ' + t;
  if(flash){
    ind.classList.add('flash');
    setTimeout(()=>ind.classList.remove('flash'), 900);
  }
}

/* =========================================================
   渲染
========================================================= */

function render(){
  document.getElementById('reportDate').value = state.reportDate;
  renderSummary();
  renderBatches();
}

function renderSummary(){
  const strip = document.getElementById('summaryStrip');
  let total=0, active=0, left=0, presentAll=0, trackedAll=0;
  state.batches.forEach(b=>{
    const s = batchStats(b);
    total += s.total; active += s.active; left += s.left;
    if(b.trackAttendance){ presentAll += s.present; trackedAll += s.present + s.absent; }
  });
  const attritionRate = total? (left/total*100):0;
  const attendRate = trackedAll? (presentAll/trackedAll*100):null;
  strip.innerHTML = `
    <div class="stat-card">
      <div class="label">全部批次开培总人数</div>
      <div class="value">${total}<small>人</small></div>
    </div>
    <div class="stat-card">
      <div class="label">当前在册（留存）</div>
      <div class="value good">${active}<small>人</small></div>
    </div>
    <div class="stat-card">
      <div class="label">累计流失</div>
      <div class="value bad">${left}<small>人 · ${attritionRate.toFixed(1)}%</small></div>
    </div>
    <div class="stat-card">
      <div class="label">今日实际出勤（可统计批次）</div>
      <div class="value ${attendRate!==null && attendRate<100 ? 'warn':'good'}">${attendRate===null?'—':attendRate.toFixed(0)+'%'}<small>${trackedAll?`(${presentAll}/${trackedAll})`:''}</small></div>
    </div>
  `;
}

function renderBatches(){
  const grid = document.getElementById('batchGrid');
  grid.innerHTML = '';
  state.batches.forEach(b=>{
    const s = batchStats(b);
    const card = document.createElement('div');
    card.className = 'batch-card';

    const goodPct = s.total ? (s.active/s.total*100) : 0;
    const badPct = 100 - goodPct;

    card.innerHTML = `
      <div class="batch-head">
        <div class="title-row">
          <h2>${b.name}</h2>
        </div>
        <div class="open-info">开班日期 ${b.openDate}</div>
        <div class="batch-nums">
          <div class="num"><div class="n">${s.total}</div><div class="l">开培人数</div></div>
          <div class="num good"><div class="n">${s.active}</div><div class="l">当前在册</div></div>
          <div class="num bad"><div class="n">${s.attritionRate.toFixed(1)}%</div><div class="l">流失率（${s.left}人）</div></div>
          <div class="num ${s.attendRate===null?'':(s.attendRate<100?'warn':'good')}">
            <div class="n">${b.trackAttendance ? (s.attendRate===null?'—':s.attendRate.toFixed(0)+'%') : (b.restToday?'排休':'—')}</div>
            <div class="l">今日出勤</div>
          </div>
        </div>
        <div class="seg-bar">
          <div style="width:${goodPct}%;background:var(--good)"></div>
          <div style="width:${badPct}%;background:var(--bad)"></div>
        </div>
        <div class="seg-legend">
          <span><i style="background:var(--good)"></i>在岗 ${s.active}</span>
          <span><i style="background:var(--bad)"></i>已流失 ${s.left}</span>
        </div>
        <div class="batch-note">⚠ ${getBatchNote(b, s)}</div>
      </div>
      <div class="roster">
        <div class="roster-header-row">
          <span>#</span><span>姓名</span><span>${b.trackAttendance?'今日':''}</span><span>在册状态</span><span></span>
        </div>
        <div class="people-list" data-batch="${b.id}"></div>
        <button class="add-person" data-batch="${b.id}">＋ 添加人员</button>
      </div>
    `;
    const stageSelect = document.createElement('select');
    stageSelect.className = 'stage';
    STAGE_OPTIONS.forEach(stage=>{
      const option = document.createElement('option');
      option.value = stage;
      option.textContent = stage;
      stageSelect.appendChild(option);
    });
    stageSelect.value = normalizeStage(b.stage);
    stageSelect.addEventListener('change', ()=>{
      b.stage = stageSelect.value;
      persist();
    });
    const headerActions = document.createElement('div');
    headerActions.className = 'batch-actions';
    headerActions.appendChild(stageSelect);
    const scheduleBtn = document.createElement('button');
    scheduleBtn.type = 'button';
    scheduleBtn.className = 'schedule-toggle' + (b.restToday ? ' rest' : '');
    scheduleBtn.textContent = b.restToday ? '排休' : '排班';
    scheduleBtn.title = b.restToday ? '点击切换为排班' : '点击切换为排休';
    scheduleBtn.setAttribute('aria-pressed', String(b.restToday));
    scheduleBtn.addEventListener('click', ()=>{
      b.restToday = !b.restToday;
      b.trackAttendance = !b.restToday;
      persist(); render();
    });
    headerActions.appendChild(scheduleBtn);
    card.querySelector('.title-row').appendChild(headerActions);
    grid.appendChild(card);
    const list = card.querySelector('.people-list');
    const displayedPeople = b.people.filter(p=>p.active).concat(b.people.filter(p=>!p.active));
    displayedPeople.forEach((p, idx)=> list.appendChild(renderPersonRow(b, p, idx)));
  });

  // bind add-person buttons
  grid.querySelectorAll('.add-person').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const b = state.batches.find(x=>x.id===btn.dataset.batch);
      b.people.push(makePerson('待补充', {placeholder:true}));
      persist(); render();
    });
  });
}

function renderPersonRow(b, p, idx){
  const rowWrap = document.createElement('div');

  const row = document.createElement('div');
  row.className = 'person-row' + (p.active ? '' : ' left');

  // index
  const idxEl = document.createElement('div');
  idxEl.className='idx'; idxEl.textContent = idx+1;
  row.appendChild(idxEl);

  // name cell
  const nameCell = document.createElement('div');
  nameCell.className='name-cell';
  const nameInput = document.createElement('input');
  nameInput.className='name-input' + (p.placeholder && p.name.startsWith('待补充') ? ' placeholder-name':'');
  nameInput.value = p.name;
  nameInput.addEventListener('change', ()=>{ p.name = nameInput.value.trim() || '待补充'; persist(); });
  nameCell.appendChild(nameInput);
  if(p.tag){
    const tagEl = document.createElement('span');
    tagEl.className='tag-badge'; tagEl.textContent=p.tag;
    nameCell.appendChild(tagEl);
  }
  row.appendChild(nameCell);

  // attendance
  const attCell = document.createElement('div');
  if(b.trackAttendance){
    attCell.className='chip-toggle';
    const btnP = document.createElement('button');
    btnP.className='chip att-present' + (p.todayAttend===true?' active':'');
    btnP.textContent='出勤';
    btnP.addEventListener('click', ()=>{ p.todayAttend = (p.todayAttend===true)?null:true; persist(); render(); });
    const btnA = document.createElement('button');
    btnA.className='chip att-absent' + (p.todayAttend===false?' active':'');
    btnA.textContent='未出勤';
    btnA.addEventListener('click', ()=>{ p.todayAttend = (p.todayAttend===false)?null:false; persist(); render(); });
    attCell.appendChild(btnP); attCell.appendChild(btnA);
  } else if(b.restToday){
    attCell.className='rest-tag'; attCell.textContent='排休';
  }
  row.appendChild(attCell);

  // active status
  const statusCell = document.createElement('div');
  const statusBtn = document.createElement('button');
  statusBtn.className='status-chip ' + (p.active?'on':'off');
  statusBtn.textContent = p.active ? '在岗' : '已流失';
  statusBtn.addEventListener('click', ()=>{ p.active = !p.active; if(p.active) p.leaveReason=''; persist(); render(); });
  statusCell.appendChild(statusBtn);
  row.appendChild(statusCell);

  // delete
  const delCell = document.createElement('button');
  delCell.className='del-btn'; delCell.title='删除该行'; delCell.textContent='×';
  delCell.addEventListener('click', ()=>{
    if(confirm(`确认删除「${p.name}」这一行吗？此操作不可撤销。`)){
      b.people = b.people.filter(x=>x.id!==p.id);
      persist(); render();
    }
  });
  row.appendChild(delCell);

  rowWrap.appendChild(row);

  // leave reason note (shown when marked 已流失)
  if(!p.active){
    const noteRow = document.createElement('div');
    noteRow.className='note-row';
    const ta = document.createElement('textarea');
    ta.rows = 1;
    ta.placeholder='请填写流失原因…';
    ta.value = p.leaveReason;
    ta.addEventListener('change', ()=>{ p.leaveReason = ta.value; persist(); });
    ta.addEventListener('input', ()=>autoResizeTextarea(ta));
    noteRow.appendChild(ta);
    rowWrap.appendChild(noteRow);
    autoResizeTextarea(ta);
  }

  // today attendance note (shown when marked absent and still active)
  if(b.trackAttendance && p.todayAttend===false && p.active){
    const tNote = document.createElement('div');
    tNote.className='today-note-row';
    const input = document.createElement('input');
    input.style.cssText='width:100%;height:26px;border:1px solid var(--warn-border);background:var(--warn-bg);border-radius:7px;padding:0 8px;line-height:24px;font-size:11.5px;color:var(--ink);font-family:inherit;';
    input.placeholder='未出勤原因备注…';
    input.value = p.todayNote;
    input.addEventListener('change', ()=>{ p.todayNote = input.value; persist(); });
    tNote.appendChild(input);
    rowWrap.appendChild(tNote);
  }

  return rowWrap;
}

/* =========================================================
   工具栏事件
========================================================= */
document.getElementById('reportDate').addEventListener('change', e=>{
  state.reportDate = e.target.value; persist();
});
document.getElementById('saveBtn').addEventListener('click', ()=> persist(true));

function canvasToPngBlob(canvas){
  return new Promise((resolve, reject)=>{
    canvas.toBlob(blob=> blob ? resolve(blob) : reject(new Error('无法生成图片')), 'image/png');
  });
}

function downloadDashboardImage(blob){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `培训批次在编看板_${state.reportDate}.png`;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 0);
}

function setImageCopyStatus(message, type){
  const status = document.getElementById('imageCopyStatus');
  status.textContent = message;
  status.className = 'image-copy-indicator' + (type ? ` ${type}` : '');
}

document.getElementById('copyImageBtn').addEventListener('click', async ()=>{
  const btn = document.getElementById('copyImageBtn');
  btn.disabled = true;
  setImageCopyStatus('正在生成图片…');
  try{
    if(typeof html2canvas !== 'function') throw new Error('图片生成组件未加载');
    const canvas = await html2canvas(document.querySelector('.wrap'), {
      backgroundColor: '#F3F5FA',
      scale: 2,
      useCORS: true,
      ignoreElements: element=>element.closest && element.closest('.toolbar')
    });
    const blob = await canvasToPngBlob(canvas);
    if(navigator.clipboard && window.ClipboardItem){
      try{
        await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
        setImageCopyStatus('图片已复制，可直接粘贴到钉钉群', 'success');
      }catch(error){
        downloadDashboardImage(blob);
        setImageCopyStatus('浏览器未允许复制，已下载 PNG 图片', 'success');
      }
    }else{
      downloadDashboardImage(blob);
      setImageCopyStatus('当前浏览器不支持复制，已下载 PNG 图片', 'success');
    }
  }catch(error){
    console.error('复制看板图片失败', error);
    setImageCopyStatus('图片生成失败，请检查网络后重试', 'error');
  }finally{
    btn.disabled = false;
  }
});

document.getElementById('exportJsonBtn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `批次看板备份_${state.reportDate}.json`;
  a.click(); URL.revokeObjectURL(url);
});

document.getElementById('importJsonBtn').addEventListener('click', ()=>{
  document.getElementById('importFile').click();
});
document.getElementById('importFile').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = evt=>{
    try{
      const data = JSON.parse(evt.target.result);
      if(!data.batches) throw new Error('格式不正确');
      state = normalizeState(data); persist(true); render();
      alert('导入成功');
    }catch(err){ alert('导入失败：文件格式不正确'); }
  };
  reader.readAsText(file);
  e.target.value = '';
});

document.getElementById('exportCsvBtn').addEventListener('click', ()=>{
  const rows = [['批次','姓名','标签','在册状态','流失原因','今日出勤','今日备注']];
  state.batches.forEach(b=>{
    b.people.forEach(p=>{
      rows.push([
        b.name, p.name, p.tag||'',
        p.active?'在岗':'已流失', p.leaveReason||'',
        b.trackAttendance ? (p.todayAttend===true?'出勤':p.todayAttend===false?'未出勤':'') : (b.restToday?'排休':''),
        p.todayNote||''
      ]);
    });
  });
  const csv = '\uFEFF' + rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `批次花名册_${state.reportDate}.csv`;
  a.click(); URL.revokeObjectURL(url);
});

document.getElementById('resetBtn').addEventListener('click', ()=>{
  if(confirm('确认恢复为初始数据吗？当前所有修改将丢失（建议先导出备份）。')){
    state = defaultData(); persist(true); render();
  }
});

render();
</script>
